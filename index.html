<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efoy Bingo - Firebase Multiplayer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    /* የካርድ እና የቦርድ ዲዛይን ስታይል እዚህ ጋር ይቀጥላል */
  </style>
</head>
<body>

  <!-- የቢንጎ UI አቀማመጥ (Header, Board, Current Call, Buttons...) -->

  <script>
    // --- 1. Telegram WebApp Init ---
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    function showMsg(msg) {
      if (tg && tg.showAlert) tg.showAlert(msg);
      else alert(msg);
    }

    // --- 2. Firebase Config & Initialization ---
    const firebaseConfig = {
      apiKey: "AIzaSyCjsg9hgwCr8HCtkeVScZPcKTby9TJrUtM",
      authDomain: "efoy-bingo.firebaseapp.com",
      databaseURL: "https://efoy-bingo-default-rtdb.firebaseio.com",
      projectId: "efoy-bingo",
      storageBucket: "efoy-bingo.firebasestorage.app",
      messagingSenderId: "893878716636",
      appId: "1:893878716636:web:7421f98ea5ff5f0e760c19",
      measurementId: "G-5FPZE60PCP"
    };

    // Firebase ን ማስጀመር
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // --- 3. Realtime Database Listener ---
    database.ref('games/game_PS9731').on('value', (snapshot) => {
      const gameData = snapshot.val();
      console.log("ከ Firebase የመጣ ዳታ፦", gameData);

      if (gameData) {
        // የጨዋታውን ሁኔታ (WAIT, PLAYING...) UI ላይ ማዘመን
        const statusElement = document.getElementById('status-text');
        if (statusElement) statusElement.innerText = gameData.status;

        // የወጣውን ቁጥር (Current Call) ማሳየት
        const currentCallElement = document.getElementById('current-call');
        if (currentCallElement && gameData.currentCall !== null) {
          currentCallElement.innerText = gameData.currentCall;
        }
      }
    });

    // --- 4. የቦርድ እና የካርድ አጀማመር ተግባራት ---
    initMasterBoard();
    loadCardByNumber(20);
  </script>
</body>
</html>
